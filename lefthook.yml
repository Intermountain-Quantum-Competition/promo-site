# The npm project is not at the repo root, so the eslint job sets `root:` to point at it.
# `root` is a per-job option in lefthook -- setting it at the top level silently does
# nothing, and jobs then run from the repo root where there is no package.json.

pre-commit:
    parallel: true
    jobs:
        - name: eslint
          root: 'src/iqc-site/'
          glob: '*.{ts,mts,tsx,vue}'
          run: npx --no-install eslint --fix {staged_files}
          stage_fixed: true

        # Deliberately has no `root:`. Prettier is repo-wide -- README.md, lefthook.yml and
        # the CI workflows all need it. `root:` does not just set the working directory, it
        # also *filters* {staged_files} to that subtree, which is exactly how the root-level
        # files escaped formatting entirely until now.
        #
        # Running from the repo root means there is no node_modules to resolve against, so
        # the binary is located explicitly with --prefix. Plain `npx --no-install prettier`
        # appears to work here only because npx falls back to its own machine-local cache;
        # on a fresh clone it fails.
        - name: prettier
          glob: '*.{ts,mts,tsx,vue,css,json,jsonc,md,yml,yaml,code-snippets}'
          run: npx --no-install --prefix src/iqc-site prettier --write --ignore-path .prettierignore {staged_files}
          stage_fixed: true

pre-push:
    jobs:
        - name: typecheck
          root: 'src/iqc-site/'
          run: npm run typecheck
